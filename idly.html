<!DOCTYPE html>
<html lang="en">
<head>
    <button onclick="toggleCart()" style="position:absolute; right:20px; top:15px;">
🛒 Cart
</button>

<meta charset="UTF-8">
<title>Idly Express</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
}

/* HEADER */
header {
    background: #e23744;
    color: white;
    padding: 15px;
    text-align: center;
}

/* SEARCH */
.search-box {
    padding: 1px;
    text-align: top left;
    background: white;
}

.search-box input {
    width: 8%;
    padding: 4px;
    border-radius: 5px;
    border: 1px solid #ccc;
}



/* SEARCH CONTAINER */
.search-container {
    position: absolute;
    top: 15px;
    left: 15px;
}

/* ICON */
.search-icon {
    font-size: 20px;
    cursor: pointer;
}

/* INPUT (hidden initially) */
.search-container input {
    width: 0;
    padding: 5px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
    transition: all 0.4s ease;
    opacity: 0;
    margin-left: 5px;
}

/* WHEN ACTIVE */
.search-container.active input {
    width: 160px;
    opacity: 1;
}

/* LAYOUT */
.container {
    display: flex;
}

/* MENU */
.menu {
    width: 70%;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

/* Image */
.card img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
}

/* Content */
.card-content {
    flex: 1;
    margin-left: 15px;
}

/* Title */
.card-content h3 {
    margin: 0;
    font-size: 16px;
}

/* Price */
.price {
    margin: 5px 0;
    color: #e23744;
    font-weight: bold;
}

/* Button */
button {
    padding: 8px 12px;
    border-radius: 6px;
}

/* MOBILE */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .menu, .cart {
        width: 100%;
    }
}
</style>
</head>
<script>
function toggleCart() {
    document.querySelector('.cart').classList.toggle('active');
}
</script>

<div class="card-content">
<h3>Ghee Idly</h3>
<p class="price">₹55</p>
<button onclick="addItem('Ghee Idly',55)">Add</button>
</div>
</div>

</div>

<!-- CART -->
<div class="cart">
<h2>🛒 Cart</h2>
<div id="cart"></div>
<p><b>Total: ₹<span id="total">0</span></b></p>
</div>

</div>

<script>
let cart = {};

function addItem(name, price) {
    if(cart[name]) {
        cart[name].qty++;
    } else {
        cart[name] = {price: price, qty: 1};
    }
    renderCart();
}

function changeQty(name, delta) {
    cart[name].qty += delta;
    if(cart[name].qty <= 0) delete cart[name];
    renderCart();
}

function renderCart() {
    let cartDiv = document.getElementById("cart");
    cartDiv.innerHTML = "";
    let total = 0;

    for(let item in cart) {
        let div = document.createElement("div");
        div.classList.add("cart-item");

        total += cart[item].price * cart[item].qty;

        div.innerHTML = `
            <span>${item}</span>
            <div>
                <button onclick="changeQty('${item}',-1)">-</button>
                ${cart[item].qty}
                <button onclick="changeQty('${item}',1)">+</button>
            </div>
        `;

        cartDiv.appendChild(div);
    }

    document.getElementById("total").innerText = total;
}

/* SEARCH */
function toggleSearch() {
    let container = document.querySelector(".search-container");
    container.classList.toggle("active");

    let input = document.getElementById("search");
    if (container.classList.contains("active")) {
        input.focus();
    }
}

function searchItems() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let name = card.getAttribute("data-name");
        if (name.includes(input)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>
